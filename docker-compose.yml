services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gps_tracker
      POSTGRES_USER: gps
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gps -d gps_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gps:change-this-password@postgres:5432/gps_tracker
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python /app/telegram-bot/bot.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gps:change-this-password@postgres:5432/gps_tracker
    depends_on: [backend]
    volumes:
      - ./telegram-bot:/app/telegram-bot:ro
volumes:
  postgres_data:
