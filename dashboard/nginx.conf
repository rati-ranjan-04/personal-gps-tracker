server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # The authenticated tracker needs the Vercel serverless proxy. Never expose
    # the backend bearer token through a static frontend or generic proxy.
    location /api/ { return 503; }
}
